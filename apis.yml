aid: connectder
name: ConnectDER
description: ConnectDER is a Philadelphia-based clean energy hardware company and the
  leading US manufacturer of meter socket adapters (MSAs, also called meter collars)
  for the residential market. Founded in 2011 as Infinite Invention LLC after a DOE
  SunShot Incubator grant, it builds plug-and-play devices that install at the utility
  meter socket to interconnect distributed energy resources — rooftop solar, battery
  storage and EV charging — without panel upgrades, line-side taps or circuit relocations.
  Its product line is the IslandDER MSA (a microgrid interconnect device for solar-plus-battery
  and whole-home backup, integrated by SolarEdge, FranklinWH, Lunar Energy, EcoFlow
  and Fox ESS), the Solar MSA and the EV MSA. ConnectDER helped author UL 414 Supplements
  A, B and C, the standards governing meter socket adapters, and has surpassed 40,000
  devices installed across US utility territories including PG&E, SCE and SDG&E. ConnectDER
  publishes no public developer API, SDK or machine-readable API contract; its devices
  communicate with partner battery systems over discrete hardwired sensing, control
  and status signals rather than a network interface. It does publish an llms.txt at
  its web root.
